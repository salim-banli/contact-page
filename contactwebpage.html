<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT US</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- NAVBAR from Bootstrap -->
<nav class="navbar navbar-expand-lg bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">FAST_TRACK</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Contact</a></li>
      </ul>
      <span class="navbar-text">Toll Free: +256 772206394</span>
    </div>
  </div>
</nav>

<!-- CONTACT FORM from Bootstrap Forms -->
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 bg-success p-4 rounded shadow-sm">
      <h3 class="text-center mb-1">Contact Us</h3>
<img src="myphoto.jpg" class="rounded mx-auto d-block img-fluid shadow-sm" alt="contact page">
      <p class="text-center text-muted small mb-4">We will reply as soon as possible</p>
      
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">First Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your first name">
        </div>
 <div class="mb-3">
          <label for="name" class="form-label">Second Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your second name">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" placeholder="name@example.com">
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="phone" placeholder="+256 700 000000">
        </div>

        <div class="mb-3">
          <label for="subject" class="form-label">Subject</label>
          <input type="text" class="form-control" id="subject" placeholder="e.g. Inquiry about services,prescription,Home visit">
        </div>

        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="3" placeholder="Send your message here OR Feedback about service"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Send Message</button>
      </form>
    </div>
  </div>
</div>


</body>
</html>
